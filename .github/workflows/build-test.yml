name: Build and test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    # SETUP .NET
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.x.x
    - name: Restore fable
      run: dotnet tool restore

    # SETUP NODE
    - name: Setup Node.js environment
      uses: actions/setup-node@v3
      with:
          node-version: 18
    - name: install node modules
      working-directory: ./
      run: npm install --ignore-scripts
    - name: esbuild postinstall
      working-directory: ./
      run: npm explore esbuild -- npm run postinstall

    # SETUP PYTHON
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        # 3.12 minimum: fable-library uses PEP 695 generics (`class FSharpList[T]`), which do not
        # parse on 3.11. Its own metadata still claims >=3.10, but Fable tests against 3.12+ only.
        python-version: '3.12'
    - name: Setup Virtual Environment
      run: python -m venv .venv
    - name: Setup Poetry Windows
      if: matrix.os == 'windows-latest'
      run: |
          .\.venv\Scripts\python.exe -m pip install -U pip setuptools
          .\.venv\Scripts\python.exe -m pip install uv
          .\.venv\Scripts\python.exe -m uv pip install -r pyproject.toml --group dev
    - name: Setup Poetry Unix
      if: matrix.os == 'ubuntu-latest'
      run: |
          ./.venv/bin/python -m pip install -U pip setuptools
          ./.venv/bin/python -m pip install uv
          ./.venv/bin/python -m uv pip install -r pyproject.toml --group dev

    # BUILD
    - name: make script executable
      if: matrix.os == 'ubuntu-latest'
      run: chmod u+x build.sh
    - name: Test (Unix)
      if: matrix.os == 'ubuntu-latest'
      working-directory: ./
      run: ./build.sh runtests --fail-on-focused-tests
    - name: Test (Windows)
      if: matrix.os == 'windows-latest'
      run: .\build.cmd runtests --fail-on-focused-tests
